# ============================================================
#  GuRoYeokSiBal messages (English)
#
#  Messages support MiniMessage formatting. Each player sees the
#  file that matches their client language.
#  To add a language, copy this file to lang/<code>.yml (e.g. ja.yml, zh.yml)
# ============================================================

# Sent when a profane message is blocked (BLOCK mode)
block-message: '<red>You can''t send messages with profanity.'

# Sent when an all-caps message is blocked (block-all-caps)
caps-block-message: '<red>You can''t send messages in all caps.'

# Sent while chat cooldown is active (placeholders: {seconds})
cooldown-message: '<red>You''re on chat cooldown. Try again in <yellow>{seconds}<red> seconds.'

# Sent to staff when profanity is detected (placeholders: {player}, {message})
notify-format: '<aqua>[GuRoYeokSiBal] <red>{player}<yellow>: <gray>{message}'

# /guroyeoksibal command responses
command:
  reload: '<aqua>[GuRoYeokSiBal] <green>Reloaded the config and profanity list.'
  # Placeholders: {words}, {mode}, {notify}
  status: '<aqua>[GuRoYeokSiBal] <white>Keywords <green>{words}<white> | Mode <green>{mode}<white> | Notify <aqua>{notify}'
  status-on: '<green>ON'
  status-off: '<red>OFF'
  usage: '<aqua>[GuRoYeokSiBal] <yellow>Usage: /guroyeoksibal \<reload|status>'
